<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodega El Ahorro - Productos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .contenedor { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .producto { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .precio { color: #27ae60; font-size: 1.2em; font-weight: bold; }
        button { background-color: #2980b9; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1c5980; }
    </style>
</head>
<body>

    <h1>🛒 Tienda de Abarrotes - Catálogo</h1>

    <div class="contenedor">
        <div class="producto">
            <h3>Leche Evaporada</h3>
            <p>Tarro de 400g</p>
            <p class="precio">S/ 4.20</p>
            <button onclick="agregar('Leche Evaporada')">Agregar al carrito</button>
        </div>

        <div class="producto">
            <h3>Arroz Extra</h3>
            <p>Bolsa de 1 Kg</p>
            <p class="precio">S/ 4.50</p>
            <button onclick="agregar('Arroz Extra')">Agregar al carrito</button>
        </div>

        <div class="producto">
            <h3>Azúcar Rubia</h3>
            <p>Bolsa de 1 Kg</p>
            <p class="precio">S/ 3.80</p>
            <button onclick="agregar('Azúcar Rubia')">Agregar al carrito</button>
        </div>

        <div class="producto">
            <h3>Aceite Vegetal</h3>
            <p>Botella de 900 ml</p>
            <p class="precio">S/ 8.50</p>
            <button onclick="agregar('Aceite Vegetal')">Agregar al carrito</button>
        </div>
    </div>

    <script>
        function agregar(producto) {
            alert("Has agregado " + producto + " a tu pedido.");
        }
    </script>

</body>
</html>
